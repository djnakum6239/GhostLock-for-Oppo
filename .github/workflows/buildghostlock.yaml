name: Build GhostLock

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allows you to manually trigger the build from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c # Meets the r25+ requirement
          add-to-path: true

      - name: Build with Make
        run: |
          # Set the required NDK paths
          export ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}
          export ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}
          
          # Force the use of the standard compiler binary and explicitly target API 34
          TOOLCHAIN_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          
          make CC="$TOOLCHAIN_BIN/aarch64-linux-android-clang" CFLAGS="-target aarch64-linux-android34"
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghostlock-bin
          path: ghostlock
          
