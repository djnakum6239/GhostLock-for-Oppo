name: Build GhostLock

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Build GhostLock Executable
        run: |
          # 1. Map out the exact prebuilt path given by the NDK manager step
          export ANDROID_NDK_HOME="${{ steps.setup-ndk.outputs.ndk-path }}"
          export ANDROID_NDK_ROOT="${{ steps.setup-ndk.outputs.ndk-path }}"
          TOOLCHAIN_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          
          # 2. Patch the rigid path formula inside the Makefile directly
          # This forces it to look for 'aarch64-linux-android-clang' natively
          sed -i "s|\$(NDK_BIN)/aarch64-linux-android\$(API)-clang|\$(NDK_BIN)/aarch64-linux-android-clang|g" Makefile
          
          # 3. Inject the compilation target flag to strictly enforce Android 14 API 34 compatibility
          sed -i 's/CFLAGS =/CFLAGS = --target=aarch64-linux-android34/g' Makefile
          
          # 4. Safely compile the executable with the explicit binary directory assignment
          make API=34 NDK_BIN="$TOOLCHAIN_BIN"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghostlock-bin
          path: ghostlock
          
