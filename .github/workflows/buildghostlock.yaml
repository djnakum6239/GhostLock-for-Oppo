name: Build GhostLock

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Build GhostLock Executable
        run: |
          # 1. Export required NDK home targets
          export ANDROID_NDK_HOME="${{ steps.setup-ndk.outputs.ndk-path }}"
          export ANDROID_NDK_ROOT="${{ steps.setup-ndk.outputs.ndk-path }}"
          
          # 2. Identify the NDK binary directory path
          TOOLCHAIN_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          
          # 3. Create the symlink shortcut that the Makefile is forcing a lookup for
          # This bridges the gap between NDK r25 toolchain names and the hardcoded Makefile logic
          ln -sf "$TOOLCHAIN_BIN/aarch64-linux-android-clang" "$TOOLCHAIN_BIN/aarch64-linux-android34-clang"
          
          # 4. Trigger the build safely with the correct API flag parameter
          make API=34

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghostlock-bin
          path: ghostlock
          
